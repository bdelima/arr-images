name: Release tdarr-download-validator

# Builds and publishes bdelima/tdarr-download-validator. Unlike the arr images it does not follow an upstream
# release, so it is published on demand only: dispatch it after changing tdarr-download-validator/ (and bump
# tdarr-download-validator/VERSION). Merging a pull request does not publish anything.
#
# Same `release` Environment as release.yml (main branch only, holds the Docker Hub secrets).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not push"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-tdarr-download-validator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < tdarr-download-validator/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: python3 -m unittest discover -s tdarr-download-validator -v

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event.inputs.dry_run != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tdarr-download-validator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            bdelima/tdarr-download-validator:${{ steps.v.outputs.version }}
            bdelima/tdarr-download-validator:latest

name: Release tdarr-flow-plugins

# Builds and publishes bdelima/tdarr-flow-plugins, a DOCKER_MODS overlay for the Tdarr SERVER container that puts four Local
# Flow Plugins and the flow templates into the server's plugin folder at every start. It does not follow an upstream
# release, so it is published on demand only: dispatch it after changing tdarr-flow-plugins/ (and bump
# tdarr-flow-plugins/VERSION). Merging a pull request does not publish anything.
#
# linux/amd64 only (every Tdarr host here is x86_64; nothing is compiled). Same `release` Environment as release.yml
# (main branch only, holds the Docker Hub secrets). A new image name may need the Docker Hub token's repository scope widened.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not push"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-tdarr-flow-plugins
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < tdarr-flow-plugins/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (amd64, loaded locally)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tdarr-flow-plugins/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          tags: arr-test/tdarr-flow-plugins:ci

      - name: Smoke test
        run: tdarr-flow-plugins/smoke-test.sh arr-test/tdarr-flow-plugins:ci

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event.inputs.dry_run != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push (amd64)
        if: github.event.inputs.dry_run != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tdarr-flow-plugins/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            bdelima/tdarr-flow-plugins:${{ steps.v.outputs.version }}
            bdelima/tdarr-flow-plugins:latest

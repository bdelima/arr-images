name: CI

# Builds the overlay images (radarr, sonarr, lidarr, sportarr) from the current upstream releases and runs the start-test against them.
# Nothing is pushed anywhere and no secrets are used. A new upstream release that changes the patched lines
# of TaskManager.cs makes this fail, which is the point: it is the early warning.

on:
  pull_request:
    paths:
      - 'radarr/**'
      - 'sonarr/**'
      - 'lidarr/**'
      - 'sportarr/**'
      - 'tdarr-download-validator/**'
      - 'common/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'radarr/**'
      - 'sonarr/**'
      - 'lidarr/**'
      - 'sportarr/**'
      - 'tdarr-download-validator/**'
      - 'common/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [radarr, sonarr, lidarr, sportarr]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve upstream version and the LinuxServer base build
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-upstream.sh "${{ matrix.app }}"

      - name: The base image does not exist yet
        if: steps.up.outputs.status == 'no-base'
        run: echo "::notice::the base image for ${{ matrix.app }} ${{ steps.up.outputs.version }} does not exist yet; nothing to test"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.up.outputs.status == 'ok'

      - name: Build (amd64, loaded locally, not pushed)
        if: steps.up.outputs.status == 'ok'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: arr-test/${{ matrix.app }}:ci
          build-args: |
            UPSTREAM_TAG=${{ steps.up.outputs.upstream_tag }}
            BASE_TAG=${{ steps.up.outputs.base_tag }}
            VERSION=${{ steps.up.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Start-test (defaults, overrides, bad file)
        if: steps.up.outputs.status == 'ok'
        run: tests/start-test.sh "${{ matrix.app }}" "arr-test/${{ matrix.app }}:ci" "${{ steps.up.outputs.version }}"

  validator:
    # tdarr-download-validator: unit tests against a fake Tdarr, then the image itself is built and answers /health.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit tests
        run: python3 -m unittest discover -s tdarr-download-validator -v

      - name: Build the image
        run: docker build -f tdarr-download-validator/Dockerfile --build-arg VERSION="$(cat tdarr-download-validator/VERSION)" -t arr-test/tdarr-download-validator:ci .

      - name: The image starts and answers
        run: |
          docker run -d --name validator-ci -e TDARR_URL=http://127.0.0.1:1 -e TDARR_LIBRARY_ID=lib -p 127.0.0.1:8080:8080 arr-test/tdarr-download-validator:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"ok": true'
          # Tdarr is unreachable here: the answer must still be a clean "not ready", not an error
          curl -fsS -X POST -d '{"path":"/downloads/x"}' http://127.0.0.1:8080/validate | tee /dev/stderr | grep -q '"ready": false'
          docker logs validator-ci 2>&1 | tail -5

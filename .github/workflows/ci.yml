name: CI

# Builds the overlay images (radarr, sonarr, lidarr, sportarr) from the current upstream releases and runs the start-test against them.
# Nothing is pushed anywhere and no secrets are used. A new upstream release that changes the patched lines
# of TaskManager.cs makes this fail, which is the point: it is the early warning.
# A change to markdown files alone (the '!**/*.md' lines below) does not start a build. Within a change, only the
# jobs it can affect run: scripts/ci-changes.sh maps the changed files to jobs (the `changes` job below), and a manual
# run or a commit range that cannot be compared builds everything.

on:
  pull_request:
    paths:
      - 'radarr/**'
      - 'sonarr/**'
      - 'lidarr/**'
      - 'sportarr/**'
      - 'tdarr-download-validator/**'
      - 'tdarr-vmaf-cuda/**'
      - 'tdarr-dovi-tool/**'
      - 'tdarr-flow-plugins/**'
      - 'common/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'radarr/**'
      - 'sonarr/**'
      - 'lidarr/**'
      - 'sportarr/**'
      - 'tdarr-download-validator/**'
      - 'tdarr-vmaf-cuda/**'
      - 'tdarr-dovi-tool/**'
      - 'tdarr-flow-plugins/**'
      - 'common/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.c.outputs.apps }}
      validator: ${{ steps.c.outputs.validator }}
      vmaf: ${{ steps.c.outputs.vmaf }}
      dovi: ${{ steps.c.outputs.dovi }}
      flowplugins: ${{ steps.c.outputs.flowplugins }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: The decision script's own tests
        run: tests/test-ci-changes.sh

      - name: Which jobs this change needs
        id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve upstream version and the LinuxServer base build
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-upstream.sh "${{ matrix.app }}"

      - name: The base image does not exist yet
        if: steps.up.outputs.status == 'no-base'
        run: echo "::notice::the base image for ${{ matrix.app }} ${{ steps.up.outputs.version }} does not exist yet; nothing to test"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.up.outputs.status == 'ok'

      - name: Build (amd64, loaded locally, not pushed)
        if: steps.up.outputs.status == 'ok'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: arr-test/${{ matrix.app }}:ci
          build-args: |
            UPSTREAM_TAG=${{ steps.up.outputs.upstream_tag }}
            BASE_TAG=${{ steps.up.outputs.base_tag }}
            VERSION=${{ steps.up.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Start-test (defaults, overrides, bad file)
        if: steps.up.outputs.status == 'ok'
        run: tests/start-test.sh "${{ matrix.app }}" "arr-test/${{ matrix.app }}:ci" "${{ steps.up.outputs.version }}"

  validator:
    # tdarr-download-validator: unit tests against a fake Tdarr, then the image itself is built and answers /health.
    needs: changes
    if: needs.changes.outputs.validator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit tests
        run: python3 -m unittest discover -s tdarr-download-validator -v

      - name: Build the image
        run: docker build -f tdarr-download-validator/Dockerfile --build-arg VERSION="$(cat tdarr-download-validator/VERSION)" -t arr-test/tdarr-download-validator:ci .

      - name: The image starts and answers
        run: |
          docker run -d --name validator-ci -e TDARR_URL=http://127.0.0.1:1 -e TDARR_LIBRARY_ID=lib -p 127.0.0.1:8080:8080 arr-test/tdarr-download-validator:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"ok": true'
          # Tdarr is unreachable here: the answer must still be a clean "not ready", not an error
          curl -fsS -X POST -d '{"path":"/downloads/x"}' http://127.0.0.1:8080/validate | tee /dev/stderr | grep -q '"ready": false'
          docker logs validator-ci 2>&1 | tail -5

  vmaf-cuda:
    # tdarr-vmaf-cuda: the overlay image is built (CUDA compile, no GPU needed) and smoke-tested on a plain Ubuntu 22.04 with no NVIDIA driver.
    # Scoring on a GPU cannot be tested here; that is checked by hand on the Tdarr node.
    needs: changes
    if: needs.changes.outputs.vmaf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space (the CUDA build image is large)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Build the overlay image
        run: docker build -f tdarr-vmaf-cuda/Dockerfile --build-arg VERSION="$(cat tdarr-vmaf-cuda/VERSION)" -t arr-test/tdarr-vmaf-cuda:ci .

      - name: Smoke test
        run: tdarr-vmaf-cuda/smoke-test.sh arr-test/tdarr-vmaf-cuda:ci

  dovi-tool:
    # tdarr-dovi-tool: the overlay image is built (a pinned, checksummed download, nothing compiled) and smoke-tested on a
    # plain Debian. There is no DoVi/HDR10+ sample file here; see tdarr-dovi-tool/smoke-test.sh.
    needs: changes
    if: needs.changes.outputs.dovi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the overlay image
        run: docker build -f tdarr-dovi-tool/Dockerfile --build-arg VERSION="$(cat tdarr-dovi-tool/VERSION)" -t arr-test/tdarr-dovi-tool:ci .

      - name: Smoke test
        run: tdarr-dovi-tool/smoke-test.sh arr-test/tdarr-dovi-tool:ci

  flow-plugins:
    # tdarr-flow-plugins: the overlay image is built (files only, nothing compiled) and smoke-tested: its contents match the
    # repo byte for byte, pass node --check, and the start-up script's copy rule is exercised in a container. A real Tdarr
    # server is needed to prove the plugins load; see the README.
    needs: changes
    if: needs.changes.outputs.flowplugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # each flow template's version is the number of commits that touched it (template-versions.sh)

      - name: Build the overlay image
        run: docker build -f tdarr-flow-plugins/Dockerfile --build-arg VERSION="$(cat tdarr-flow-plugins/VERSION)" --build-arg TEMPLATE_VERSIONS="$(tdarr-flow-plugins/template-versions.sh)" -t arr-test/tdarr-flow-plugins:ci .

      - name: Smoke test
        run: tdarr-flow-plugins/smoke-test.sh arr-test/tdarr-flow-plugins:ci
